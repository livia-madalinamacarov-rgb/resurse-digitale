<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resetare parola</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
    <aside class="auth-aside"><a class="brand" href="/login"><span
            class="brand-logo">✦</span><span>Resurse Digitale<small>Campus digital</small></span></a>
        <div class="auth-promo"><h1>Educația ta,<br/>mai conectată.</h1>
            <p>Cursuri, resurse și instrumente digitale, toate într-un singur loc.</p></div>
        <small class="auth-caption">Platformă pentru comunitatea universitară</small></aside>
    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-tag">BUN VENIT</div>
            <h2>Recuperare parolă</h2>
            <p class="hint">Alege o parolă nouă pentru contul tău.</p>
            <form action="/reset-password" class="auth-form" method="post">
                <input name="email" placeholder="Email" type="email"/><br/><br/>
                <input name="newPassword" placeholder="Parola noua" type="password"/><br/><br/>
                <button type="submit">Reseteaza parola</button>
            </form>
            <a href="/login">Inapoi la login</a></div>
    </main>
</div>
</body>
</html>
